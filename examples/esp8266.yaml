# ЧЕРНОВИК целевого формата (P2). Компонент ещё не реализован: файл показывает, как будет выглядеть конфигурация.
esphome:
  name: gate
esp8266:
  board: d1_mini
external_components:
  - source:
      type: git
      url: https://github.com/pruwait/nice-bust4-ng@main
    refresh: 0s 
logger:
  level: DEBUG
  baud_rate: 0    
ota:
  - platform: esphome
# Set statul led for Wemos D1 mini
status_led:
  pin: 
    number: D4
    inverted: true
  
wifi:
  ssid: !secret wifi_ssid
  password:  !secret wifi_password
  min_auth_mode: WPA2  

uart:
  id: t4_uart
  tx_pin: GPIO1     # UART0; логгер перенести на UART1 или отключить
  rx_pin: GPIO3
  baud_rate: 19200

nice_t4:
  id: gate_hub
  uart_id: t4_uart
  address: 0x0066        # ADR и EPT самого модуля
  identity: oview        # oview | it4wifi
  model: auto
  allow_write: false     # запись параметров только по явному включению

cover:
  - platform: nice_t4
    nice_t4_id: gate_hub
    name: Ворота

button:
  - platform: nice_t4
    nice_t4_id: gate_hub
    command: PARTIAL_OPEN_1
    name: Калитка

text_sensor:
  - platform: nice_t4
    nice_t4_id: gate_hub
    type: menu_json
    name: Меню привода
